<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181a" />
    <!-- `crossorigin="use-credentials"`, and it is not optional here. auspex
         has NO unauthenticated surface — every route including this one sits
         behind the owner gate — and a manifest is fetched anonymously by
         default, so without this attribute the browser's own fetch of it
         comes back 403 and the install silently degrades to a bookmark. The
         icons the manifest names are served by the nexus: its own root grub
         (/apps/auspex/icon.svg), the same route the launcher tile pulls, and
         PNG renders of that one drawing, so nothing else draws the icon. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <!-- The tab's icon and iOS's home-screen icon. Without the first the
         browser asks the ship for /favicon.ico and shows the ship's icon.
         iOS ignores the manifest's icons and wants an opaque square, which
         the maskable one is. Absolute paths, because neither file is in
         public/ for vite to rewrite. The nexus serves both. -->
    <link rel="icon" href="/apps/auspex/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apps/auspex/icon-maskable.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Auspex</title>
    <!-- THE PALETTE IS DECIDED BEFORE THE FIRST PAINT, not after mount.
         React sets the class too late: the browser has already painted a
         white page, so a dark-mode user sees a flash of the other palette
         on every single load. This is the whole of the pre-paint work —
         one localStorage read, one media query, one class. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('auspex:theme')
          var dark = saved === 'dark' || (saved !== 'light'
            && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          // FOLLOW TALON, BEFORE FIRST PAINT. When auspex is following
          // talon's theme (the default), the last palette it derived is
          // cached; apply it here so a reload shows talon's colours with
          // no flash of auspex's own. The class the cache carries wins,
          // because a custom talon theme brings its own light or dark.
          if (localStorage.getItem('auspex:follow-talon') !== 'off') {
            var c = localStorage.getItem('auspex:talon-cache')
            if (c) {
              c = JSON.parse(c)
              document.documentElement.classList.toggle('dark', !!c.dark)
              document.documentElement.style.cssText = c.css
            }
          }
        } catch (e) { /* private mode: fall through to the light default */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

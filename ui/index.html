<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181a" />
    <!-- `crossorigin="use-credentials"`, and it is not optional here. urmail
         has NO unauthenticated surface — every route including this one sits
         behind the owner gate — and a manifest is fetched anonymously by
         default, so without this attribute the browser's own fetch of it
         comes back 403 and the install silently degrades to a bookmark. The
         icon is a data: URI inside the manifest for the same reason: a
         separate icon fetch is not covered by this attribute everywhere. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>urmail</title>
    <!-- THE PALETTE IS DECIDED BEFORE THE FIRST PAINT, not after mount.
         React sets the class too late: the browser has already painted a
         white page, so a dark-mode user sees a flash of the other palette
         on every single load. This is the whole of the pre-paint work —
         one localStorage read, one media query, one class. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('urmail:theme')
          var dark = saved === 'dark' || (saved !== 'light'
            && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) { /* private mode: fall through to the light default */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

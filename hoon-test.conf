# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md.

DESK=auspex-test

# a grubbery desk: /< imports are translated for clay on the way, and each
# lib lands at its path under CODE
DIALECT=grubbery
CODE=code

# the libs under test, and the nexus itself, so its fibers can be driven
LIBS="code/lib/auspex-chain.hoon code/lib/auspex-web.hoon code/nex/auspex/app.hoon"

# the faces grubbery puts in a nexus's subject that this one uses
PRELUDE="tarball nexus loader io=fiberio http-utils"

# and the libs behind them, copied from the ship's own %grubbery at setup
SHIP_FILES="grubbery:lib/tarball.hoon grubbery:lib/nexus.hoon grubbery:lib/loader.hoon grubbery:lib/fiberio.hoon grubbery:lib/server.hoon grubbery:lib/http-utils.hoon grubbery:lib/multipart.hoon grubbery:sur/push.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

# fixtures, at the same path on the desk (or src=dest): the vectors test
# reads this one with a /* import
FILES="protocol/vectors/v1.json scripts/hoon-test-kit/hoon/fiber-test.hoon=lib/fiber-test.hoon"

# json builds through mime; the nexus's web-client files arrive as %mime
# through their own extensions' marks
MARKS="json mime html js svg"

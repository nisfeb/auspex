name: CI

# PR-gating checks that need no ship: the desktop shell's unit tests and
# static checks, plus the one cross-language check nothing else can make.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tauri pulls the webkit stack in at COMPILE time, so the deps are
      # needed even though every test here is pure logic (the SSE frame
      # classifier, the inbox diff, config round-trip, the URL normaliser,
      # the bridge's own relay tests).
      - name: tauri build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            pkg-config
      # A tauri command is registered in three places and missing any one of
      # them denies it at runtime with "not allowed. Command not found".
      # cargo test cannot see it, because the mismatch is between rust, a
      # build script and json. It shipped three times in lattice, which is
      # where this script comes from.
      - name: tauri commands are registered everywhere
        run: node scripts/desktop-commands.mjs
      - name: cargo test
        working-directory: desktop
        run: cargo test
      #  Lints are a ratchet or they are nothing: the findings this removes
      #  come straight back the first time nobody runs it by hand.
      - name: clippy
        working-directory: desktop
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

  ui:
    name: web client — the served artifact is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The client is SERVED BY THE SHIP out of the overlay, so the built
      # bundle is committed. A source change without a rebuild is a repo whose
      # ui/ and whose deployed client disagree, and the only symptom is a
      # feature that is in the code and not in the app.
      - name: UI builds and the committed bundle matches the source
        working-directory: ui
        run: npm ci && npm run build
      - name: no drift in the served artifact
        run: git diff --exit-code grubbery-overlay/nex/auspex/ui-app

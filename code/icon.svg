<!-- the auspex logo: an auspex reads messages in the flight of
     birds, so three birds over the horizon, the sun on it. The tile icon
     and desktop/icon-src.svg are this same drawing; every file in
     desktop/icons is rendered from it.
     Drawn the way Talon's icon is (talon scripts/make-icons.py, 2026-10-01):
     the mark centred by its drawn bounds, its longer side 62% of the
     canvas, on a rounded square of Talon's navy (#1E1B4B; 920 px with a
     52 px margin, radius 200), in the family amber (#f9a804). The
     launcher tile rounds itself and its colour is the same navy, so
     there the margin is the tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="52" y="52" width="920" height="920" rx="200" fill="#1E1B4B"/>
  <g transform="translate(36.77 4.28) scale(1.8564)">
  <g fill="none" stroke="#f9a804" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 168 Q 198 108 256 168 Q 314 108 372 168"/>
    <path d="M96 276 Q 138 232 180 276 Q 222 232 264 276"/>
    <path d="M248 276 Q 290 232 332 276 Q 374 232 416 276"/>
    <line x1="110" y1="386" x2="402" y2="386"/>
  </g>
  <circle cx="256" cy="386" r="34" fill="#f9a804"/>
  </g>
</svg>

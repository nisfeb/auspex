<!doctype html>
<meta charset="utf-8">
<title>auspex — connection</title>
<style>
  /* mirrors the auspex client's identity: amber on navy */
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --amber: #f9a804; --amber-deep: #c58203;
    --bg: #fafafa; --text: #1a1a1a; --muted: #8a8a8a;
    --border: #8886; --border-soft: #8883; --surface: #8881;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101541; --text: #e6e6e6; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .6rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  input, button {
    font: inherit; color: inherit; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  input { width: 100%; margin-bottom: .5rem; background: transparent; }
  input:focus { outline: none; border-color: var(--amber); }
  button { cursor: pointer; }
  button:hover { border-color: var(--amber); }
  button.primary { background: var(--amber); border-color: var(--amber-deep); color: #101541; }
  button.primary:hover { background: var(--amber-deep); color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .err { color: #c0392b; white-space: pre-wrap; }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .conn { border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    background: var(--surface); }
  .conn .row { align-items: center; gap: 10px; }
  .mono { font: 12px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
  /* state at a glance: amber connected, orange reachable-but-logged-out, red
     unreachable. Colour is never the only signal. The text says it too. */
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--muted); }
  .dot.on { background: var(--amber); }
  .dot.off { background: #d68910; }
  .dot.err { background: #c0392b; }
  .note { border-top: 1px solid var(--border-soft); margin-top: 2rem;
    padding-top: 1rem; }
</style>
<main>
  <!-- Leaving this page is a CLOSE, in the wording the client's own panes
       use. ALWAYS on screen, from the first paint: gating it on the
       connection check would be gating it on a real round-trip to the ship,
       so the one exit from the page would spend those seconds not existing.
       go_home refuses cleanly when no ship is configured ("connect to a ship
       first"), and that message is surfaced instead of navigating. -->
  <div class="top">
    <h1>auspex</h1>
    <button id="close">close</button>
  </div>

  <h2>ship</h2>
  <!-- the connected state is its own panel. Showing the login form whenever
       there is nothing better to say is what makes an already-connected ship
       look signed out. The form is revealed only when it is actually needed,
       or on request. -->
  <div id="conn" class="conn" hidden>
    <div class="row">
      <span id="dot" class="dot"></span>
      <div>
        <div id="conn-ship"><b>checking…</b></div>
        <div id="conn-url" class="muted mono"></div>
      </div>
    </div>
    <div class="row" style="margin-top:.7rem">
      <button id="relog" hidden>reconnect</button>
      <button id="switch">change ship</button>
    </div>
  </div>

  <form id="connect" hidden>
    <input id="url" placeholder="https://your-ship.example.com" required>
    <input id="code" type="password" placeholder="+code" required>
    <div class="row">
      <button class="primary">connect</button>
      <button type="button" id="cancel" hidden>cancel</button>
      <span id="connect-status" class="muted"></span>
    </div>
  </form>

  <p class="note muted">auspex notifies you about new mail while this window is
  open. It watches your ship's change beacon and raises one notification per
  newly unread thread, at most three per delivery. Nothing runs in the
  background once you quit.</p>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  // the window's native chrome (the GTK menubar) follows the window theme,
  // not the page's; mirror prefers-color-scheme into it here too, so the
  // manager page is not the one page with a white menubar over a dark ground
  {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const tell = () => { invoke('set_theme', { dark: mq.matches }).catch(() => {}); };
    tell();
    mq.addEventListener('change', tell);
  }

  // Show the login form only when logging in is actually the thing to do.
  // `connected` comes from a real authenticated request, not from "we have a
  // url in the config". A stored url proves we logged in once, which is
  // precisely the state that reads as signed out if you let it.
  const showForm = (on, cancelable) => {
    $('connect').hidden = !on;
    $('cancel').hidden = !cancelable;
    if (on) $('code').focus();
  };
  async function refreshConn() {
    $('conn').hidden = false;
    const s = await invoke('connection_status');
    $('url').value = s.url || $('url').value;
    $('conn-url').textContent = s.url || '';
    const dot = $('dot'), ship = $('conn-ship');
    if (s.connected) {
      dot.className = 'dot on';
      ship.innerHTML = '<b>connected</b> as ' + (s.ship || 'your ship');
      $('relog').hidden = true; $('switch').hidden = false;
      showForm(false, false);
    } else if (s.error) {
      dot.className = 'dot err';
      ship.innerHTML = '<b>cannot reach this ship</b>';
      $('conn-url').textContent = (s.url || '') + ' — ' + s.error;
      $('relog').hidden = false; $('switch').hidden = false;
      showForm(false, false);
    } else if (s.url) {
      dot.className = 'dot off';
      ship.innerHTML = '<b>signed out</b> — enter your +code to reconnect';
      $('relog').hidden = true; $('switch').hidden = false;
      showForm(true, false);
    } else {
      // never configured: the form IS the page, and there is nothing to cancel
      $('conn').hidden = true;
      showForm(true, false);
    }
  }
  refreshConn();
  // Close never waits on anything. go_home navigates when a ship is
  // configured and refuses with a message when none is; that message lands in
  // the form's status line rather than vanishing into a rejected promise.
  const closeManager = () => invoke('go_home').catch((e) => {
    const s = $('connect-status');
    s.textContent = String(e); s.className = 'err';
  });
  $('close').onclick = closeManager;
  // Escape closes too, matching the client's dialogs — same non-blocking rule.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeManager();
  });
  $('relog').onclick = () => showForm(true, true);
  $('switch').onclick = () => { $('url').value = ''; showForm(true, true); $('url').focus(); };
  $('cancel').onclick = () => { showForm(false, false); refreshConn(); };

  $('connect').addEventListener('submit', async (e) => {
    e.preventDefault();
    const s = $('connect-status');
    s.textContent = 'connecting…'; s.className = 'muted';
    try {
      const ship = await invoke('connect', { url: $('url').value, code: $('code').value });
      s.textContent = 'connected as ' + ship;
      $('code').value = '';
      refreshConn();
    } catch (err) {
      s.textContent = String(err); s.className = 'err';
    }
  });
</script>
